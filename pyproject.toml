[tool.poetry]
name = "ebook"
version = "1.0.10"
description = "IMAP url -> SMTP mobi"
authors = ["Szczyp <qb@szczyp.com>"]
license = "GPL-3.0-or-later"

[tool.poetry.scripts]
ebook = 'ebook:main'
url2ebook = 'ebook:url2ebook'
hyphenate = 'ebook:hyphenate'

[tool.poetry.dependencies]
python = "^3.11"
IMAPClient = "^3.0.1"
pandocfilters = "^1.5.1"
Pyphen = "^0.15.0"
urlextract = "^1.9.0"
PyYAML = "^6.0.1"
aiohttp = "^3.9.5"
beautifulsoup4 = "^4.12.3"
langdetect = "^1.0.9"

[tool.poetry.dev-dependencies]
pylint = "^3.1.0"
yapf = "^0.40.2"
isort = "^5.13.2"
jedi = "^0.19.1"
pynvim = "^0.5.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
